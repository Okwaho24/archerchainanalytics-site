name: design-screenshots
on:
  push:
    branches: [chore/design-system]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 20); do curl -fs http://localhost:8080/index.html >/dev/null && break; sleep 1; done
      - name: Take screenshots
        run: |
          for f in *.html; do
            node design/shoot.mjs "http://localhost:8080/$f" "${f%.html}"
          done
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/screenshots
          git diff --cached --quiet || git commit -m "chore: update design screenshots"
          git push
